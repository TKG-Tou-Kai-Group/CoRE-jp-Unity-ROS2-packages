controller_manager:
  ros__parameters:
    update_rate: 10  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

# 走行は ros2_control を通らない。
#
# 以前は omni_wheel_controller が cmd_vel を 4 輪の車輪速度へ変換し、
# ros2_control 経由でシミュレータへ送っていたが、駆動をシミュレータ側の
# body_twist_drive (車体への直接加力) へ置き換えたので、
# /<機体名>/cmd_vel をシミュレータが直接購読する。
#
# 速度・加速度の上限は以前ここにあった omni_wheel_controller の設定を
# そのまま simulation/sample_robot.simulation.xacro へ移してある
# (linear.x: 1.0 m/s / 0.4 m/s^2、angular.z: 1.5 rad/s / 0.8 rad/s^2)。
# 変更するときはそちらを見ること。
#
# odom は omni_wheel_controller が車輪から積分して出していたが、
# シミュレータが真値を /<機体名>/ground_truth に出すのでそちらを使う。

velocity_controller:
  ros__parameters:
    joints:
      - shooter_wheel1_link_joint
      - shooter_wheel2_link_joint
      - shooter_loader_link_joint
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity
      - effort
