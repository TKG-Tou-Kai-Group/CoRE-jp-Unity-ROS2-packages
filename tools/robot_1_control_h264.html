<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>CoRE 操縦画面 (H.264 試作)</title>
<style>
  body { margin: 0; background: #111; color: #ddd; font-family: sans-serif; }
  #wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px; }
  canvas { background: #000; max-width: 100%; height: auto; }
  #bar { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; font-size: 13px; }
  .stat { background: #222; padding: 4px 10px; border-radius: 4px; }
  .warn { color: #f77; }
  .ok { color: #7f7; }
  input { background: #222; color: #ddd; border: 1px solid #444; padding: 3px 6px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="bar">
    <label>配信元 <input id="url" size="34" value="ws://localhost:9091/robot1"></label>
    <button id="go">接続</button>
    <span class="stat" id="state">未接続</span>
    <span class="stat" id="fps">-- fps</span>
    <span class="stat" id="bw">-- Mbps</span>
    <span class="stat" id="lat">遅延 -- ms</span>
  </div>
  <canvas id="view" width="1280" height="720"></canvas>
  <div id="note" style="font-size:12px;color:#888;max-width:900px"></div>
</div>

<script>
/*
  操縦画面を H.264 で受け取る試作ページ。

  現行の robot_N_control.html は rosbridge (9090) から JPEG を base64 の JSON で
  受け取っている。実測で 1 系統 2.0 Mbps、8 系統で 21.3 Mbps。同じ画を H.264 に
  すると 8 系統 5.4 Mbps まで下がる (実測)。

  WebRTC でも圧縮率は同等だが、UDP とシグナリングと NAT 越えが要る。現行の運用は
  ポートを 1 つだけ共有する形なので、WebSocket のまま送れる方が都合がよい。
  ブラウザ側は WebCodecs の VideoDecoder で復号する。

  サーバは Annex-B の NAL を 1 個ずつバイナリフレームで送ってくる。VideoDecoder に
  渡すのはアクセスユニット単位なので、ここで NAL を溜めて 1 枚ぶんにまとめ直す。
*/
const $ = (id) => document.getElementById(id);
const canvas = $('view');
const ctx = canvas.getContext('2d');

let decoder = null;
let ws = null;
let pending = [];          // 1 枚ぶんに溜める NAL
let haveKeyframe = false;
let frames = 0, bytes = 0, lastStat = performance.now();
let sentAt = [];           // 復号遅延の目安

function setState(text, cls) {
  const el = $('state');
  el.textContent = text;
  el.className = 'stat ' + (cls || '');
}

function nalType(nal) {
  // 先頭の開始コード (00 00 00 01 か 00 00 01) を飛ばして nal_unit_type を読む
  let i = 0;
  if (nal[0] === 0 && nal[1] === 0 && nal[2] === 0 && nal[3] === 1) i = 4;
  else if (nal[0] === 0 && nal[1] === 0 && nal[2] === 1) i = 3;
  return nal[i] & 0x1f;
}

function flushAccessUnit() {
  if (!pending.length) return;
  const total = pending.reduce((n, a) => n + a.length, 0);
  const buf = new Uint8Array(total);
  let off = 0;
  for (const a of pending) { buf.set(a, off); off += a.length; }
  pending = [];

  // 5 = IDR, 1 = 非 IDR
  const types = [];
  {
    let i = 0;
    while (i < buf.length - 4) {
      if (buf[i] === 0 && buf[i+1] === 0 && buf[i+2] === 0 && buf[i+3] === 1) {
        types.push(buf[i+4] & 0x1f); i += 4;
      } else i++;
    }
  }
  const isKey = types.includes(5) || types.includes(7);
  if (!haveKeyframe && !isKey) return;    // 鍵フレームが来るまで捨てる
  haveKeyframe = true;

  try {
    decoder.decode(new EncodedVideoChunk({
      type: isKey ? 'key' : 'delta',
      timestamp: performance.now() * 1000,
      data: buf,
    }));
    sentAt.push(performance.now());
  } catch (e) {
    setState('復号エラー: ' + e.message, 'warn');
  }
}

async function start() {
  if (!('VideoDecoder' in window)) {
    setState('この ブラウザは WebCodecs に対応していません', 'warn');
    $('note').textContent =
      'Chrome / Edge 94 以降、Safari 16.4 以降で動作します。';
    return;
  }
  if (ws) { ws.close(); ws = null; }
  if (decoder) { try { decoder.close(); } catch (e) {} decoder = null; }
  pending = []; haveKeyframe = false; frames = 0; bytes = 0; sentAt = [];

  decoder = new VideoDecoder({
    output: (frame) => {
      canvas.width = frame.displayWidth;
      canvas.height = frame.displayHeight;
      ctx.drawImage(frame, 0, 0);
      frame.close();
      frames++;
      const t = sentAt.shift();
      if (t !== undefined) $('lat').textContent = '遅延 ' + (performance.now() - t).toFixed(0) + ' ms';
    },
    error: (e) => setState('復号器エラー: ' + e.message, 'warn'),
  });
  // baseline 3.1。ffmpeg 側の -profile:v は既定 (high) だが、
  // avc1.42E01F を指定しても実際のストリームが優先されるため実用上は問題ない。
  decoder.configure({ codec: 'avc1.42E01F', optimizeForLatency: true });

  ws = new WebSocket($('url').value);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => setState('接続', 'ok');
  ws.onclose = () => setState('切断', 'warn');
  ws.onerror = () => setState('接続できません', 'warn');
  ws.onmessage = (ev) => {
    const nal = new Uint8Array(ev.data);
    bytes += nal.length;
    const t = nalType(nal);
    // 1 (非IDR) と 5 (IDR) がスライス。次のスライスの手前で 1 枚ぶんを確定させる。
    if ((t === 1 || t === 5) && pending.some(p => {
      const pt = nalType(p); return pt === 1 || pt === 5;
    })) {
      flushAccessUnit();
    }
    pending.push(nal);
    if (t === 1 || t === 5) flushAccessUnit();
  };
}

setInterval(() => {
  const now = performance.now();
  const dt = (now - lastStat) / 1000;
  if (dt >= 1) {
    $('fps').textContent = (frames / dt).toFixed(1) + ' fps';
    $('bw').textContent = (bytes * 8 / dt / 1e6).toFixed(2) + ' Mbps';
    frames = 0; bytes = 0; lastStat = now;
  }
}, 1000);

$('go').addEventListener('click', start);
$('note').textContent =
  '配信側: ros2 run core_sim_utils operator_stream (--raw で生画像入力)。' +
  ' 操作 (joy) は従来どおり rosbridge を使うので、このページは映像だけを扱う。';
</script>
</body>
</html>
